<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="preload" href="index.js" as="script">
		<link rel="preload" href="index.wasm" as="fetch" crossorigin>
		<link rel="preload" href="index.pck" as="fetch" crossorigin>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #00ffc8;
	background-color: #0a0a12;
	overflow: hidden;
	touch-action: none;
	font-family: "Courier New", monospace;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	background-color: #0a0a12;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background:
		radial-gradient(circle at 18% 18%, rgba(0, 180, 255, 0.22), transparent 42%),
		radial-gradient(circle at 82% 78%, rgba(0, 255, 200, 0.16), transparent 44%),
		repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.07) 2px, rgba(0, 0, 0, 0.07) 4px),
		#0a0a12;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 14px;
	visibility: hidden;
	z-index: 10;
	padding: 24px;
	box-sizing: border-box;
}

#status-splash {
	display: none !important;
}

#boot-brand {
	font-size: clamp(2.4rem, 9vw, 4rem);
	letter-spacing: 0.18em;
	text-transform: uppercase;
	color: #00ffc8;
	text-shadow: 0 0 24px rgba(0, 255, 200, 0.55), 0 0 48px rgba(0, 180, 255, 0.35);
	animation: boot-pulse 1.6s ease-in-out infinite;
}

#boot-sub {
	font-size: 0.85rem;
	letter-spacing: 0.28em;
	text-transform: uppercase;
	color: #8090a0;
}

#boot-bytes {
	font-size: 0.8rem;
	letter-spacing: 0.08em;
	color: #607080;
	min-height: 1.2em;
}

#boot-tip {
	max-width: 26rem;
	text-align: center;
	font-size: 0.78rem;
	line-height: 1.45;
	letter-spacing: 0.04em;
	color: #6f8496;
	min-height: 2.6em;
}

#boot-start {
	display: none;
	margin-top: 8px;
	padding: 14px 28px;
	border: 1px solid rgba(0, 255, 200, 0.55);
	border-radius: 999px;
	background: rgba(0, 255, 200, 0.12);
	color: #00ffc8;
	font: inherit;
	font-size: 1rem;
	letter-spacing: 0.16em;
	text-transform: uppercase;
	cursor: pointer;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	position: relative;
	width: min(420px, 70vw);
	height: 12px;
	margin: 4px auto 0;
	appearance: none;
	border: 1px solid rgba(0, 255, 200, 0.45);
	border-radius: 999px;
	background: rgba(18, 18, 28, 0.9);
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: rgba(18, 18, 28, 0.9);
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #00b4ff, #00ffc8);
	box-shadow: 0 0 16px rgba(0, 255, 200, 0.55);
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #00b4ff, #00ffc8);
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
	max-width: 28rem;
}

@keyframes boot-pulse {
	0%, 100% { opacity: 0.85; transform: scale(1); }
	50% { opacity: 1; transform: scale(1.03); }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="boot-brand">CyberTime</div>
			<div id="boot-sub">Syncing neon grid</div>
			<div id="boot-bytes">Preparing download…</div>
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<button id="boot-start" type="button">Tap to start</button>
			<div id="boot-tip">Tip: turn MOBILE ON for tap controls</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const bootBytes = document.getElementById('boot-bytes');
	const bootSub = document.getElementById('boot-sub');
	const bootTip = document.getElementById('boot-tip');
	const bootStart = document.getElementById('boot-start');
	const tips = [
		'Tip: blue = tap / left click',
		'Tip: red bombs need 2 taps on mobile',
		'Tip: orange = 3 taps on mobile',
		'Tip: hit sliders anywhere on the orb',
		'Tip: build combo for bigger scores',
		'Tip: World 2 has its own tracks',
		'Tip: shop backgrounds change the arena',
	];
	let tipIndex = 0;
	const tipTimer = setInterval(() => {
		tipIndex = (tipIndex + 1) % tips.length;
		if (bootTip) bootTip.textContent = tips[tipIndex];
	}, 2800);

	const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
		|| (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const preferTapStart = isIOS || (navigator.maxTouchPoints > 0 && /Mobile|Android/i.test(navigator.userAgent));

	let initializing = true;
	let statusMode = '';
	let startTimer = null;
	let prefetchDone = false;
	let startRequested = false;

	const CACHE_NAME = 'cybertime-assets-v3';
	const ASSET_FILES = ['index.wasm', 'index.pck', 'index.js'];

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(tipTimer);
			if (startTimer) clearTimeout(startTimer);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		clearInterval(tipTimer);
		if (startTimer) clearTimeout(startTimer);
		bootStart.style.display = 'none';
		let msg = 'An unknown error occurred.';
		if (err instanceof Error) {
			msg = err.message || String(err);
		} else if (typeof err === 'string') {
			msg = err;
		}
		if (/out of memory|OOM|sab|SharedArrayBuffer/i.test(msg)) {
			msg = 'Phone ran out of memory starting the game.\nClose other tabs and tap reload.';
		}
		setStatusNotice(msg);
		setStatusMode('notice');
		if (bootSub) bootSub.textContent = 'Start failed';
		if (bootBytes) bootBytes.textContent = 'Try a refresh';
		initializing = false;
	}

	function markDownloadProgress(current, total) {
		if (current > 0 && total > 0) {
			statusProgress.value = current;
			statusProgress.max = total;
			const mb = (v) => (v / (1024 * 1024)).toFixed(1);
			const pct = Math.min(100, Math.round((current / total) * 100));
			if (bootBytes) bootBytes.textContent = pct + '%  ·  ' + mb(current) + ' / ' + mb(total) + ' MB';
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
			if (bootBytes) bootBytes.textContent = 'Downloading game data…';
		}
	}

	async function fetchIntoCache(url, onChunk) {
		// Stream to disk/HTTP cache without keeping the whole file in JS memory.
		const response = await fetch(url, { credentials: 'same-origin', cache: 'reload' });
		if (!response.ok) {
			throw new Error('Failed to download ' + url);
		}
		const lenHeader = response.headers.get('Content-Length');
		const total = lenHeader ? parseInt(lenHeader, 10) : 0;
		if (!response.body || !response.body.getReader) {
			const buf = await response.arrayBuffer();
			onChunk(buf.byteLength, buf.byteLength || total);
			return;
		}
		const reader = response.body.getReader();
		let received = 0;
		while (true) {
			const { done, value } = await reader.read();
			if (done) break;
			received += value.byteLength;
			onChunk(received, total > 0 ? total : received);
		}
	}

	async function prefetchAssets() {
		if (bootSub) bootSub.textContent = 'Downloading';
		statusProgress.style.display = 'block';
		const sizes = GODOT_CONFIG.fileSizes || {};
		const knownTotal = (sizes['index.wasm'] || 0) + (sizes['index.pck'] || 0);
		const progress = { wasm: 0, pck: 0, wasmTotal: sizes['index.wasm'] || 0, pckTotal: sizes['index.pck'] || 0 };

		function report() {
			const current = progress.wasm + progress.pck;
			const total = (progress.wasmTotal + progress.pckTotal) || knownTotal || current;
			markDownloadProgress(current, total);
		}

		await Promise.all([
			fetchIntoCache('index.wasm', (n, t) => {
				progress.wasm = n;
				if (t > 0) progress.wasmTotal = t;
				report();
			}),
			fetchIntoCache('index.pck', (n, t) => {
				progress.pck = n;
				if (t > 0) progress.pckTotal = t;
				report();
			}),
		]);
		// Warm JS too (small).
		fetch('index.js', { credentials: 'same-origin', cache: 'force-cache' }).catch(() => {});
		prefetchDone = true;
		const total = progress.wasmTotal + progress.pckTotal;
		markDownloadProgress(total, total);
		if (bootSub) bootSub.textContent = 'Ready';
		if (bootBytes) bootBytes.textContent = 'Download complete';
		if (preferTapStart && !startRequested) {
			bootStart.style.display = 'block';
			if (bootTip) bootTip.textContent = 'Tap to start — files are cached on this phone';
		}
	}

	function beginGame() {
		startRequested = true;
		bootStart.style.display = 'none';
		if (bootSub) bootSub.textContent = 'Starting engine';
		if (bootBytes) bootBytes.textContent = 'Compiling game…';
		statusProgress.style.display = 'block';
		startTimer = setTimeout(() => {
			displayFailureNotice('Startup timed out on this phone.\nClose other apps and reload.');
		}, 45000);
		return engine.startGame({
			'onProgress': markDownloadProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		if (preferTapStart) {
			if (bootTip) bootTip.textContent = 'Downloading in the background — tap when ready';
			bootStart.style.display = 'none';
			prefetchAssets().then(() => {
				bootStart.onclick = () => beginGame();
				if (startRequested) beginGame();
			}).catch((err) => {
				console.warn('Prefetch failed, falling back', err);
				bootStart.style.display = 'block';
				if (bootSub) bootSub.textContent = 'Ready on phone';
				if (bootBytes) bootBytes.textContent = 'Tap to download & start';
				bootStart.onclick = () => beginGame();
			});
			// Allow early tap: start as soon as user taps, even mid-download.
			bootStart.style.display = 'block';
			bootStart.textContent = 'Tap to start';
			bootStart.onclick = () => {
				if (!prefetchDone) {
					if (bootSub) bootSub.textContent = 'Finishing download';
				}
				beginGame();
			};
		} else {
			beginGame();
		}
	}

	if ('serviceWorker' in navigator) {
		navigator.serviceWorker.register('sw.js').catch(() => {});
	}

	window.cybertimeToggleFullscreen = function () {
		const node = document.documentElement;
		if (!document.fullscreenElement && !document.webkitFullscreenElement) {
			const req = node.requestFullscreen || node.webkitRequestFullscreen;
			if (req) req.call(node);
			return;
		}
		const exit = document.exitFullscreen || document.webkitExitFullscreen;
		if (exit) exit.call(document);
	};
}());
		</script>
	</body>
</html>
